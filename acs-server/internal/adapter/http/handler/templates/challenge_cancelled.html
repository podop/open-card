<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Cancelled</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 360px; background: #fff; border-radius: 10px; padding: 40px 32px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #fff0f0; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 32px; height: 32px; }
    h2 { margin: 0 0 8px; font-size: 20px; color: #c00; }
    p  { margin: 0; font-size: 14px; color: #777; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#c00" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </div>
  <h2>Transaction Cancelled</h2>
  <p>You have cancelled this transaction.<br>No payment has been processed.</p>
</div>
</body>
</html>
