<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Unavailable</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 360px; background: #fff; border-radius: 10px; padding: 40px 32px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-top: 4px solid #e6a817; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 20px; color: #222; }
    p  { margin: 0 0 6px; font-size: 14px; color: #777; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">&#9888;</div>
  <h2>Verification Unavailable</h2>
  <p>We were unable to verify your identity at this time.</p>
  <p>Returning you to the merchant&hellip;</p>
</div>
<!-- Post CRes (base64url-encoded) to the 3DS Server notification URL per EMV 3DS spec. -->
<form id="cresForm" method="POST" action="{{.NotifURL}}">
  <input type="hidden" name="cres" value="{{.CResB64}}">
</form>
<script>
  // Auto-submit after 3 seconds, only when a notification URL is configured.
  var form = document.getElementById("cresForm");
  if (form.action && form.action !== window.location.href) {
    setTimeout(function() { form.submit(); }, 3000);
  }
</script>
</body>
</html>
