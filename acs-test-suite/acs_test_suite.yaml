- id: TC-ACS-PROT-001
  family: PROTOCOL
  category: AReq/ARes core
  name: Valid frictionless AReq accepted and ARes returned
  severity: CRITICAL
  requestType: AReq
  responseType: ARes
  deviceChannel: '01'
  transStatusExpected: Y
  preconditions:
  - ACS is deployed with protocol feature set enabled
  - 3DS Server simulator and Directory Server simulator are reachable
  - Correlation IDs and audit logging are enabled
  steps:
  - Build AReq payload for category 'AReq/ARes core' and scenario seed 'valid frictionless
    AReq accepted and ARes returned'
  - Apply scenario-specific mutations or headers
  - Send request to ACS endpoint under test
  - Capture HTTP status, response body, logs, and persisted transaction state
  expectedResults:
  - transStatus=Y
  - HTTP 200
  - state moves to AUTHENTICATED or COMPLETED
  - responseType=ARes
  tags:
  - protocol
  - areq-ares-core
  - areq
  - ares
